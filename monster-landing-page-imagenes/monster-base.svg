<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="100%" height="100%">
  <defs>
    <!-- Filtro de Resplandor Neón Extremo -->
    <filter id="monster-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="sharp" />
      <feGaussianBlur stdDeviation="12" result="soft" />
      <feMerge>
        <feMergeNode in="soft" />
        <feMergeNode in="sharp" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Haz de Luz Radiactiva -->
    <linearGradient id="beam-light" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#39FF14" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#00FF66" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#39FF14" stop-opacity="0" />
    </linearGradient>

    <!-- Metal Oscuro Cyberpunk -->
    <linearGradient id="cyber-metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a1a" />
      <stop offset="50%" stop-color="#0d0d0d" />
      <stop offset="100%" stop-color="#050505" />
    </linearGradient>
  </defs>

  <!-- Haz de Luz Vertical de Fondo -->
  <polygon points="150,230 450,230 520,10 80,10" fill="url(#beam-light)" />

  <!-- Base Cyberpunk Octagonal (Bordes Afilados) -->
  <polygon points="120,240 180,210 420,210 480,240 450,270 150,270" fill="url(#cyber-metal)" stroke="#39FF14" stroke-width="2" filter="url(#monster-glow)" />

  <!-- Estructura Inferior Afilada -->
  <path d="M 120 240 L 150 270 L 150 290 L 110 255 Z" fill="#0a0a0a" stroke="#222" />
  <path d="M 480 240 L 450 270 L 450 290 L 490 255 Z" fill="#0a0a0a" stroke="#222" />

  <!-- Anillos de Energía Neón -->
  <ellipse cx="300" cy="230" rx="200" ry="40" fill="none" stroke="#39FF14" stroke-width="4" filter="url(#monster-glow)" />
  <ellipse cx="300" cy="230" rx="150" ry="30" fill="none" stroke="#00FF66" stroke-width="2" stroke-dasharray="12 6" />

  <!-- Detalles de Circuitos / Marcas Afiladas -->
  <path d="M 180 230 L 220 230 L 240 240" fill="none" stroke="#39FF14" stroke-width="2" opacity="0.8" />
  <path d="M 420 230 L 380 230 L 360 240" fill="none" stroke="#39FF14" stroke-width="2" opacity="0.8" />

  <!-- Plataforma Central de Carga de Energía -->
  <ellipse cx="300" cy="230" rx="90" ry="18" fill="#111" stroke="#39FF14" stroke-width="3" />
  <ellipse cx="300" cy="230" rx="75" ry="14" fill="#39FF14" opacity="0.85" filter="url(#monster-glow)" />

  <!-- Rayos de Energía Centrales (Garras) -->
  <path d="M 290 220 L 300 200 L 310 220" stroke="#FFF" stroke-width="2" fill="none" filter="url(#monster-glow)" />
</svg>
